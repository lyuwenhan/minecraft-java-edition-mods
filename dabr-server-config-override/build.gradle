plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "1.0.0"
group = "com.example"

base {
    archivesName = "dabr-server-config-override"
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly "maven.modrinth:do-a-barrel-roll:${dabr_version}"

    runtimeOnly "maven.modrinth:do-a-barrel-roll:${dabr_version}"
    runtimeOnly "maven.modrinth:cicada:${cicada_version}"
    runtimeOnly "maven.modrinth:yacl:${yacl_version}"
    runtimeOnly "maven.modrinth:modmenu:${modmenu_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
