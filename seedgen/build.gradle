plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}"
group = "com.example"

base {
    archivesName = "seedgen"
}

loom {
    runs {
        client {
            programArguments.addAll("--username", "TestPlayer")
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Xaero's Maven"
        url = "https://chocolateminecraft.com/maven"
    }
    maven {
        name = "JourneyMap Maven"
        url = "https://maven.blamejared.com"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly "maven.modrinth:voxy:${voxy_version}"
    compileOnly "maven.modrinth:journeymap:${journeymap_version}"
    compileOnly "xaero.map:xaeroworldmap-fabric-${minecraft_version}:${xaero_world_map_version}"
    compileOnly "info.journeymap:journeymap-api-fabric:${journeymap_api_version}"

    runtimeOnly "maven.modrinth:sodium:${sodium_version}"
    runtimeOnly "maven.modrinth:journeymap:${journeymap_version}"
    runtimeOnly "maven.modrinth:voxy:${voxy_version}"
    runtimeOnly "xaero.map:xaeroworldmap-fabric-${minecraft_version}:${xaero_world_map_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
